# Evaluator manifest. `run` boots the system, `seed` loads demo data.
run: python run.py
seed: python seed.py
base_url: http://localhost:8004
test: python -m pytest -q

# Endpoints to probe (Layer 2 acceptance probes in the brief).
endpoints:
  health: GET /health
  billable: POST /generate            # send twice with one Idempotency-Key -> one usage event
  usage: GET /usage/{tenant_id}       # rollup: used, limit, cost_microusd
  checkout: POST /billing/checkout    # Stripe test-mode Checkout session
  webhook: POST /webhooks/stripe      # forged signature -> 400; replayed event -> ignored
  invoices: GET /invoices/{tenant_id} # finalized UTC-month statements

# Demo tenants created by `seed` (free tier, for driving the quota boundary).
seed_tenants:
  free_alice:
    id: 1
    x_tenant_key: dev-tenant-1-key
  free_bob:
    id: 2
    x_tenant_key: dev-tenant-2-key
